{% extends "testApp/base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}


    <p> Uploaded by {{ user.username }} </p>

<form method="POST">
    {% csrf_token %}

    <div>
        <label for="playlist_name">Playlist Name:</label><br>
        <input
            type="text"
            id="playlist_name"
            name="playlist_name"
            required
        >
    </div>

    <br>


    <button type="submit">
        Save Playlist
    </button>
</form>

{% endblock %}
