{% extends "testApp/base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}

{% if user.is_authenticated %}
    <h2>{{ user.username }}'s Playlists</h2>

<div id="collection" class="collection"></div>

<!-- Hidden template -->
<div id="card-template" style="display: none;">
    {% include "components/card.html" %}
</div>

<button onclick="addComponent()">Add Card</button>
<button onclick="removeComponent()">Remove Card</button>

	
	
	<a href="/add-song/">
        <button>Add a Song</button>
    </a>

{% else %}
    <h2>Looks like you need a profile, please login or sign up!</h2>
{% endif %}

<script>
function addComponent() {
    const collection = document.getElementById("collection");
    const template = document.getElementById("card-template");

    const newCard = template.firstElementChild.cloneNode(true);
    collection.appendChild(newCard);

    newCard.addEventListener("click", () => {
        console.log("Card clicked");
    });
}

function removeComponent() {
    const collection = document.getElementById("collection");

    if (collection.lastElementChild) {
        collection.removeChild(collection.lastElementChild);
    }
}
</script>

{% endblock %}
