<!DOCTYPE html>
<html>
<head>
    <title>Home</title>	
<style>
	.collection {
		display: flex;
		flex-direction: row;
		gap: 20px;
		flex-wrap: wrap;
	}
 </style>
</head>

<body style="background-color: white;">

    <h1>Welcome to SoundWav</h1>
	<div style="
	width: 90%;
	height: 15px;
	background-color: #001C56;
	margin-top:20px;
	margin-left:50px;
	border-radius: 10px;
	"></div>
  
  
{% if user.is_authenticated %}
    <h2>Hello {{ user.username }}!</h2>

    <form action="/accounts/logout/" method="post" style="
		position: fixed;
		top: 20px;
		right: 20px;
		z-index: 1000;
		">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
{% else %}
    <a href="/accounts/login/">
        <button style="
		position: fixed;
		top: 20px;
		right: 20px;
		z-index: 1000;
		">
		Login</button>
    </a>
	
	
	<a href="/signup/">
        <button style ="
		position: fixed;
		top: 20px;
		right: 80px;
		z-index: 1000;
		">Sign Up</button>
    </a>

{% endif %}


  
<h2>My Collection</h2>

<div id="collection" class="collection"></div>

<!-- Hidden template -->
<div id="card-template" style="display: none;">
    {% include "components/card.html" %}
</div>

<button onclick="addComponent()">Add Card</button>
<button onclick="removeComponent()">Remove Card</button>

<!--
{% include "components/card.html" with name="Item 1" %}
{% include "components/card.html" with name="Item 2" %}
{% include "components/card.html" with name="Item 3" %}

-->

<a href="/about/">
    <button>Go to About</button>
</a>



  


<script>
function addComponent() {
    const collection = document.getElementById("collection");
    const template = document.getElementById("card-template");

    const newCard = template.firstElementChild.cloneNode(true);
    collection.appendChild(newCard);
}

function removeComponent() {
    const collection = document.getElementById("collection");

    if (collection.lastElementChild) {
        collection.removeChild(collection.lastElementChild);
    }
}
</script>
</body>

</html>
